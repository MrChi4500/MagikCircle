<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotokawau Magic Circle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; color: #e8ffe8; font-family: system-ui, sans-serif; }
    #ui { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 24px; pointer-events: none; }
    button { pointer-events: auto; font-size: 28px; padding: 20px 32px; margin: 8px; border: 0; border-radius: 14px; font-weight: 700; }
    #ar { background: #6fe3a0; color: #042; }
    #vr { background: #9cf; color: #012; }
    #log { pointer-events: none; white-space: pre-wrap; text-align: center; font-size: 18px; max-width: 28em; min-height: 4em; }
    canvas { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="log">Loading model…</div>
    <button id="ar" type="button">ENTER AR (passthrough)</button>
    <button id="vr" type="button">ENTER VR (test)</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const logEl = document.getElementById('log');
    const log = (m) => { logEl.textContent = m; };

    const CIRCLE_Y = 1.02;
    const CIRCLE_Z = 0.6;

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(0, 1.2, 0.6);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x223322, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.35);
    light.position.set(1, 3, 2);
    scene.add(light);

    const root = new THREE.Group();
    root.position.set(0, CIRCLE_Y, -CIRCLE_Z);
    scene.add(root);

    const glowLight = new THREE.PointLight(0x7ef0ff, 8, 6, 1.2);
    glowLight.position.set(0, 0.2, 0);
    root.add(glowLight);

    renderer.xr.addEventListener('sessionstart', () => {
      const xrCam = renderer.xr.getCamera();
      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      xrCam.getWorldPosition(pos);
      xrCam.getWorldQuaternion(quat);
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
      forward.normalize();
      root.position.copy(pos).addScaledVector(forward, CIRCLE_Z);
      root.position.y = CIRCLE_Y;
    });

    let mixer = null;
    const clock = new THREE.Clock();

    const STEAM_COUNT = 90;
    const RING_R = 0.92;
    const dummy = new THREE.Object3D();
    const steamAge = new Float32Array(STEAM_COUNT);
    const steamLife = new Float32Array(STEAM_COUNT);
    const steamSpin = new Float32Array(STEAM_COUNT);
    const steamStart = new Float32Array(STEAM_COUNT * 3);

    function resetSteam(i) {
      const a = Math.random() * Math.PI * 2;
      const r = RING_R + (Math.random() - 0.5) * 0.22;
      steamStart[i * 3] = Math.cos(a) * r;
      steamStart[i * 3 + 1] = 0.02 + Math.random() * 0.05;
      steamStart[i * 3 + 2] = Math.sin(a) * r;
      steamAge[i] = 0;
      steamLife[i] = 1.2 + Math.random() * 1.4;
      steamSpin[i] = (Math.random() - 0.5) * 0.3;
    }

    const steamMesh = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.035, 8, 6),
      new THREE.MeshBasicMaterial({
        color: 0xb8f6ff,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      }),
      STEAM_COUNT
    );
    steamMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    root.add(steamMesh);

    for (let i = 0; i < STEAM_COUNT; i++) {
      resetSteam(i);
      steamAge[i] = Math.random() * steamLife[i];
    }

    function updateSteam(dt) {
      for (let i = 0; i < STEAM_COUNT; i++) {
        steamAge[i] += dt;
        if (steamAge[i] >= steamLife[i]) resetSteam(i);
        const t = steamAge[i] / steamLife[i];
        const x = steamStart[i * 3] + steamSpin[i] * steamAge[i];
        const y = steamStart[i * 3 + 1] + t * 0.55;
        const z = steamStart[i * 3 + 2] + steamSpin[i] * 0.4 * steamAge[i];
        const s = 0.7 + t * 1.6;
        dummy.position.set(x, y, z);
        dummy.scale.setScalar(s * (1 - t * 0.35));
        dummy.updateMatrix();
        steamMesh.setMatrixAt(i, dummy.matrix);
      }
      steamMesh.instanceMatrix.needsUpdate = true;
      steamMesh.material.opacity = 0.45 + Math.sin(clock.elapsedTime * 3) * 0.08;
    }

    function boostGlow(rootObj) {
      rootObj.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((m) => {
          m.color = new THREE.Color(0x9befff);
          m.emissive = new THREE.Color(0x7af0ff);
          m.emissiveIntensity = 18;
          m.toneMapped = false;
          m.transparent = true;
          m.depthWrite = false;
          m.needsUpdate = true;
        });
      });
    }

    new GLTFLoader().load(
      'magic_circle_v1.glb',
      (gltf) => {
        boostGlow(gltf.scene);
        root.add(gltf.scene);
        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(gltf.scene);
          mixer.clipAction(gltf.animations[0]).play();
        }
        log('Model loaded. Point at ENTER AR and squeeze the trigger.');
      },
      undefined,
      (err) => log('GLB failed to load: ' + err)
    );

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      updateSteam(dt);
      glowLight.intensity = 7.5 + Math.sin(clock.elapsedTime * 2.4) * 1.2;
      renderer.render(scene, camera);
    });

    async function start(mode) {
      if (!navigator.xr) {
        log('navigator.xr missing. You are not in Quest Browser, or WebXR is off.');
        return;
      }
      const supported = await navigator.xr.isSessionSupported(mode).catch((e) => {
        log(mode + ' isSessionSupported error: ' + e);
        return false;
      });
      log(mode + ' supported: ' + supported + '\nRequesting session…');
      if (!supported) return;
      try {
        const session = await navigator.xr.requestSession(mode, {
          optionalFeatures: ['local-floor', 'local', 'unbounded']
        });
        await renderer.xr.setSession(session);
        document.getElementById('ui').style.display = 'none';
      } catch (e) {
        log(mode + ' requestSession failed:\n' + (e && e.message ? e.message : e));
      }
    }

    document.getElementById('ar').addEventListener('click', () => start('immersive-ar'));
    document.getElementById('vr').addEventListener('click', () => start('immersive-vr'));
  </script>
</body>
</html>
