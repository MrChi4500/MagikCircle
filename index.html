<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotokawau Magic Circle</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; color: #e8ffe8; font-family: system-ui, sans-serif; }
    #hud { position: fixed; left: 12px; right: 12px; top: 16px; z-index: 10; text-align: center; }
  </style>
</head>
<body>
  <div id="hud">A-Frame build. ENTER AR. Look down.</div>
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="alpha: true; colorManagement: true"
    background="transparent: true"
    webxr="optionalFeatures: local-floor, local"
    loading-screen="enabled: false">

    <a-assets>
      <a-asset-item id="circle" src="magic_circle_v1.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 -0.6">
      <a-entity gltf-model="#circle"></a-entity>
      <a-entity id="beads"></a-entity>
      <a-entity id="steam"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const RING = 0.95;
    const scene = document.querySelector('a-scene');
    const beadsRoot = document.querySelector('#beads');
    const steamRoot = document.querySelector('#steam');
    const beads = [];
    const steam = [];

    for (let i = 0; i < 24; i++) {
      const el = document.createElement('a-sphere');
      el.setAttribute('radius', 0.045);
      el.setAttribute('color', '#ffe9a8');
      el.setAttribute('material', 'shader: flat; transparent: true');
      beadsRoot.appendChild(el);
      beads.push(el);
    }

    for (let i = 0; i < 36; i++) {
      const el = document.createElement('a-sphere');
      const a = Math.random() * Math.PI * 2;
      el.setAttribute('position', {
        x: Math.cos(a) * RING,
        y: 0.04,
        z: Math.sin(a) * RING
      });
      el.setAttribute('radius', 0.04);
      el.setAttribute('color', '#d7fbff');
      el.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.8');
      steamRoot.appendChild(el);
      steam.push({
        el: el,
        a: a,
        age: Math.random() * 2,
        life: 1.2 + Math.random(),
        spin: (Math.random() - 0.5) * 0.2
      });
    }

    scene.addEventListener('enter-vr', function () {
      document.getElementById('hud').textContent = 'AR on. Look down.';
    });

    function tick() {
      const t = performance.now() / 1000;
      for (let i = 0; i < beads.length; i++) {
        const a = t * 1.15 - i * 0.12;
        beads[i].setAttribute('position', {
          x: Math.cos(a) * RING,
          y: 0.07,
          z: Math.sin(a) * RING
        });
        const fade = 1 - i / beads.length;
        beads[i].setAttribute('radius', 0.025 + fade * 0.05);
      }
      for (const s of steam) {
        s.age += 0.016;
        if (s.age > s.life) {
          s.age = 0;
          s.a = Math.random() * Math.PI * 2;
        }
        const k = s.age / s.life;
        s.el.setAttribute('position', {
          x: Math.cos(s.a) * RING + s.spin * s.age,
          y: 0.04 + k * 0.65,
          z: Math.sin(s.a) * RING
        });
        s.el.setAttribute('material', 'shader: flat; transparent: true; opacity: ' + (0.85 * (1 - k)));
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
